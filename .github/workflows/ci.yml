name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff "bandit[toml]"

      # Ruff toma su configuración de pyproject.toml
      - name: 1. Ejecutar Ruff (Linter)
        run: |
          ruff check src/ tests/

      - name: 2. Verificar formato con Ruff
        run: |
          ruff format --check src/ tests/

      # Bandit toma su configuración de pyproject.toml (excluye tests/)
      - name: 3. Ejecutar Bandit (Seguridad)
        run: |
          bandit -c pyproject.toml -r src/ -ll

      # Pytest toma su configuración de pytest.ini y la cobertura de .coveragerc
      # (falla si la cobertura baja del 80 %)
      - name: 4. Ejecutar Pytest (Pruebas y cobertura)
        run: |
          pytest

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: htmlcov/
